works:
  - id: cuckoos-nest
    match: Пролетая над гнездом кукушки
    description: >-
      Фильм снят по одноимённому роману Кена Кизи. Действие разворачивается в психиатрической
      больнице, куда в 1963 году попал преступник Рэндл Макмёрфи. Медики должны установить,
      является ли он душевнобольным. За ним присматривает старшая медсестра Милдред Рэтчед.
      Консилиум считает Макмёрфи симулянтом, но Рэтчед добивается, чтобы он остался на принудительном лечении.
  - id: analyze-this
    match: Анализируй это
    description: >-
      Мафиозный босс Пол Витти сталкивается с паническими атаками и обращается к психоаналитику
      Бену Собелю. Для аналитика, привыкшего к обычным пациентам, работа с гангстером становится испытанием.
  - id: sopranos
    match: Клан Сопрано
    description: >-
      Тони Сопрано управляет криминальными делами Северного Джерси и одновременно живёт семейной жизнью.
      Дженнифер Мелфи — психиатр, к которой он обращается из-за панических атак.
  - id: de-gales-hus
    match: Сумасшедший дом
    description: >-
      24-летняя Аина после попытки суицида попадает в психиатрическую клинику «Варден».
      Она посещает групповую терапию и вступает в откровенные разговоры с теми, кто пытается вернуть её к реальности.
  - id: web-therapy
    match: Веб-терапия
    description: >-
      Психотерапевт Фиона Уоллис проводит трёхминутные видеовстречи вместо часовых сеансов.
      Формат сопровождается нарушением профессиональных границ, недостатком эмпатии и комичными ситуациями.
  - id: dangerous-method
    match: Опасный метод
    description: >-
      Фильм о взаимоотношениях Карла Юнга, Зигмунда Фрейда и их пациентки Сабины Шпильрейн в начале XX века.
      Сюжет исследует становление психоанализа и то, как личные переживания входят в практику.
  - id: mr-robot
    match: Мистер Робот
    description: >-
      Эллиот Алдерсон, специалист по кибербезопасности, живёт с тревогой и другими психологическими трудностями
      и оказывается вовлечён в заговор против крупной корпорации. Криста Гордон ведёт его терапию.
  - id: the-undoing
    match: Отыграть назад
    description: >-
      Грейс Фрайзер — психотерапевт из Нью-Йорка. Когда мужа подозревают в убийстве, она обнаруживает,
      как трудно применить к собственной жизни методы, которыми она пользуется с клиентами.
  - id: en-therapie
    match: В терапии
    description: >-
      Париж, осень 2015 года, следующий день после терактов 13 ноября. Психиатр Филипп Даян работает
      с пациентами, а после этой работы сам приходит на терапию. Эстер — его бывшая наставница и супервизор;
      в кодировке рассмотрен её образ.
