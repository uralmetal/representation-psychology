name: Prepare Commons photo review artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-review-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify allowlisted Commons originals
        run: python3 scripts/fetch_commons_review_photos.py
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: commons-photo-review-${{ github.run_id }}
          path: media-review/
          if-no-files-found: error
          retention-days: 3
