version: "1.0.0"
categories:
  - id: space_type
    label: Тип пространства терапии
    definition: Где происходит терапевтическое взаимодействие. Пространство задаёт отношение к профессии и уровень стигмы.
    values:
      - id: ward
        label: Палата/общественное пространство в клинике
        definition: Обезличенное, контролируемое, часто с надзором. Ассоциируется с институциональным контролем и стигмой.
        example: «Пролетая над гнездом кукушки» (палаты, общая зона, кабинет медсестры).
      - id: status-office
        label: Кабинет-статус
        definition: Упорядоченное, «академическое» пространство, подчёркивающее дистанцию и авторитет специалиста. Много книг, сдержанный декор, чёткие границы.
        example: Кабинет доктора Мелфи в «Клане Сопрано».
      - id: caricature-office
        label: Карикатурный/клишированный кабинет
        definition: Гиперболизированные детали, которые сразу считываются как «киношный shrink». Кушетка, череп на полке, слишком «театральный» интерьер. Работает на стереотип и часто на комический эффект.
        example: Кабинет в «Анализируй это».
      - id: scientific-clinic
        label: Клиника/учреждение (научно-медицинское)
        definition: Пространство, где терапия показана как часть науки и власти. Кабинеты, лаборатории, процедурные, иерархия персонала. Подчёркивает научный авторитет и одновременно уязвимость пациента.
        example: В словаре пример отнесён к «Опасному методу»; в таблице кодирования это произведение записано как палата.
      - id: neutral-office
        label: Нейтральный кабинет
        definition: Минимум деталей, фокус на контакте и приватности. Нет «знаков статуса» или «знаков опасности». Пространство как чистый лист для работы.
        example: Кабинеты в сериале «В терапии».

  - id: therapist_archetype
    label: Архетип терапевта
    definition: Устойчивый образ специалиста, который считывается зрителем. Это функция персонажа в сюжете и стереотип.
    values:
      - id: controller
        label: Властный контролёр
        definition: Терапевт как представитель системы. Решения принимаются сверху, акцент на дисциплине и контроле. Часто связан с институциональной психиатрией.
        example: Старшая медсестра в «Пролетая над гнездом кукушки».
      - id: pressured-ethical
        label: Этический профессионал под давлением
        definition: Специалист старается соблюдать границы и этику, но контекст (криминал, высокие ставки) постоянно испытывает эти границы на прочность.
        example: Доктор Мелфи в «Клане Сопрано».
      - id: comic-shrink
        label: Комичный shrink
        definition: Терапевт как носитель клише и объект шуток. Профессионализм намеренно снижен, вместо техники — «чудо-советы» и бытовые реплики.
        example: Психотерапевт в «Анализируй это».
      - id: romantic-scientist
        label: Романтизированный учёный
        definition: Терапевт как фигура власти, страсти и тайны. Границы размыты, перенос и контрперенос драматизированы, наука и личная жизнь переплетены.
        example: Юнг и Фрейд в «Опасном методе».
      - id: process
        label: Нейтральный процесс-ориентированный терапевт
        definition: Специалист как «зеркало» и проводник. Акцент на структуре сессии, паузах, отражении, прояснении. Минимум интерпретаций, максимум контакта.
        example: Терапевты в «В терапии».

  - id: ethical_violation
    label: Этическое нарушение в действиях терапевта
    definition: Насколько поведение специалиста соответствует базовым этическим принципам психотерапии (конфиденциальность, информированное согласие, границы, безопасность).
    values:
      - id: "yes"
        label: Да
        definition: Явное нарушение. Разглашение информации без согласия, романтические или сексуальные отношения с клиентом, использование клиента в научных целях без согласия, давление или принуждение.
        example: «Пролетая над гнездом кукушки», «Анализируй это», «Веб-терапия», «Опасный метод».
      - id: partial
        label: Частично
        definition: Спорная ситуация. Терапевт даёт прямые советы вместо сопровождения, нарушает границы ради «спасения», комментирует действия клиента вне сессии, но без явного злоупотребления.
        example: «Клан Сопрано», «Сумасшедший дом», «Мистер Робот».
      - id: "no"
        label: Нет
        definition: Границы соблюдены. Нейтральность, конфиденциальность, фокус на процессе.
        example: «В терапии», «Отыграть назад».

  - id: stigma_level
    label: Уровень стигмы в репрезентации профессии
    definition: Как фильм подаёт роль психолога или психиатра и доверие к ней. Стигма профессии здесь — клеймо самой профессии, а не клеймо клиента.
    values:
      - id: high
        label: Высокий
        definition: Профессия показана как сомнительная, пугающая или комичная. Доверие к специалисту подорвано.
        example: «Пролетая над гнездом кукушки», «Анализируй это».
      - id: medium
        label: Средний
        definition: Есть элементы стигмы и признание профессиональной ценности. Образ неоднозначный.
        example: «Клан Сопрано».
      - id: low
        label: Низкий
        definition: Профессия подаётся как рутинная, полезная, этичная. Специалист — обычный профессионал.
        example: «В терапии».

  - id: utterance_type
    label: Тип реплики терапевта
    definition: Какие речевые действия преобладают в терапевтической сцене.
    values:
      - id: interpretation
        label: Интерпретация
        definition: Терапевт предлагает объяснение. «Вы злитесь, потому что…», «Это про ваш детский опыт…».
        example: Доктор Мелфи в «Клане Сопрано».
      - id: question
        label: Вопрос (открытый/уточняющий)
        definition: Терапевт проясняет опыт клиента. «Расскажите подробнее…», «Что вы почувствовали в тот момент?».
        example: Сессии в «В терапии».
      - id: advice
        label: Совет/директива
        definition: Терапевт говорит, что делать. «Вам нужно…», «Попробуйте…». Частый киношный клише.
        example: Сестра Рэтчед в «Пролетая над гнездом кукушки».
      - id: support
        label: Поддержка/отражение
        definition: Терапевт подтверждает опыт. «Я слышу, как вам тяжело». Фокус на принятии и валидации.
        example: Эстер в «В терапии».
      - id: explanation
        label: Объяснение/информация
        definition: Терапевт даёт факты о диагнозе, процессе, правилах. Нейтральная передача знаний.
        example: Доктор Мелфи в «Клане Сопрано».

  - id: visual_trope
    label: Визуальный троп
    definition: Устойчивые визуальные приёмы, которыми кино показывает внутреннее состояние и психологическую напряжённость.
    values:
      - id: through-glass
        label: Съёмка через стекло/решётку
        definition: Отчуждение, наблюдение, дистанция, контроль.
        example: «Пролетая над гнездом кукушки».
      - id: low-angle
        label: Ракурс «снизу вверх» на терапевта
        definition: Власть, авторитет, дистанция.
        example: «Пролетая над гнездом кукушки», «Опасный метод».
      - id: high-angle
        label: Ракурс «сверху вниз» на клиента
        definition: Уязвимость, подчинённость.
        example: В текущем корпусе значение не встретилось.
      - id: close-up-eyes
        label: Крупный план глаз/взгляда
        definition: Внутреннее напряжение, момент осознания, «прозрение».
        example: «Анализируй это», «Клан Сопрано».
      - id: light-contrast
        label: Резкий контраст света и тени
        definition: Внутренний конфликт, борьба, «тёмная сторона».
        example: «Опасный метод», «Мистер Робот».
      - id: flashback-montage
        label: Монтаж «флешбеки/сны/галлюцинации»
        definition: Показ внутреннего мира, памяти, травмы.
        example: «Клан Сопрано», «Мистер Робот».
      - id: static-pause
        label: Статичный кадр + пауза
        definition: Тишина как терапевтический инструмент, фокус на невысказанном.
        example: «В терапии», «Клан Сопрано».
      - id: sound-distortion
        label: Звук (гул, сердцебиение, искажение)
        definition: Передача тревоги, паники, диссоциации.
        example: «Мистер Робот».
