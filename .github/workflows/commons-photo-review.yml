name: Prepare media review artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/commons-photo-review.yml"
      - "scripts/fetch_commons_review_photos.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-review-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Commons originals and package selected local candidates
        run: python3 scripts/fetch_commons_review_photos.py
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-review-${{ github.run_id }}
          path: media-review/
          if-no-files-found: error
          retention-days: 3
